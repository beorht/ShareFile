<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ShareFile</title>
<style>
:root{
  --bg:#FAF7F2;
  --surface:#FFFDF9;
  --card:#FFFFFF;
  --surface-2:#F1E6DD;
  --border:#E8E0D6;
  --text:#34312E;
  --text-dim:#77716B;
  --primary:#C9785B;
  --primary-hover:#AD6048;
  --primary-soft:rgba(201,120,91,.12);
  --peach:#E8B39E;
  --gold:#D9A441;
  --sage:#A8B9A0;
  --sage-soft:rgba(168,185,160,.22);
  --danger:#D98F72;
  --danger-soft:rgba(217,143,114,.16);
  --success:#A8B9A0;
  --radius:14px;
  --text-scale:1.5; /* text size multiplier: 1 = original sizes */
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  font-size:calc(16px * var(--text-scale));
  height:100vh;
  height:100dvh;
  display:flex;
  flex-direction:column;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--primary-soft);color:var(--text)}
button, input{font-family:inherit}
button:focus-visible, input:focus-visible, .breadcrumb span:focus-visible{
  outline:2px solid var(--primary); outline-offset:2px;
}

/* ---------- header ---------- */
header{
  background:var(--surface);
  border-bottom:1px solid var(--border);
  padding:16px 24px;
  display:flex;
  align-items:center;
  gap:20px;
  flex-shrink:0;
  flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{
  width:calc(34px * var(--text-scale));height:calc(34px * var(--text-scale));border-radius:10px;
  background:linear-gradient(155deg,var(--peach),var(--primary));
  display:flex;align-items:center;justify-content:center;
  font-size:calc(17px * var(--text-scale));flex-shrink:0;
  box-shadow:0 2px 10px rgba(201,120,91,.25);
}
.brand h1{font-size:calc(19px * var(--text-scale));font-weight:700;letter-spacing:-.01em}
.breadcrumb{display:flex;gap:6px;flex-wrap:wrap;font-size:calc(14px * var(--text-scale));flex:1;align-items:center}
.breadcrumb span{
  cursor:pointer;color:var(--text-dim);padding:6px 12px;border-radius:20px;
  transition:background .15s,color .15s;
}
.breadcrumb span:last-child{color:var(--text);font-weight:600}
.breadcrumb span:hover{background:var(--surface-2);color:var(--text)}
.crumb-sep{color:var(--text-dim);font-size:calc(12px * var(--text-scale));opacity:.6}

/* ---------- toolbar ---------- */
.toolbar{
  display:flex;gap:10px;padding:16px 24px;background:var(--bg);flex-shrink:0;flex-wrap:wrap;
}
.btn{
  display:inline-flex;align-items:center;gap:9px;
  padding:13px 22px;border-radius:12px;border:1px solid var(--border);
  background:var(--surface);color:var(--text);
  font-size:calc(14.5px * var(--text-scale));font-weight:600;cursor:pointer;
  transition:transform .12s,background .15s,border-color .15s,box-shadow .15s;
}
.btn .glyph{font-size:calc(16px * var(--text-scale));line-height:1}
.btn:hover{background:var(--surface-2);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.primary{
  background:var(--primary);border-color:var(--primary);color:#FFFFFF;
  box-shadow:0 4px 14px rgba(201,120,91,.22);
}
.btn.primary:hover{background:var(--primary-hover);border-color:var(--primary-hover);box-shadow:0 6px 18px rgba(173,96,72,.28)}
.btn.ghost{background:transparent}
.btn.ghost:hover{background:var(--surface)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#FFFFFF}
.btn.danger:hover{background:var(--primary-hover);border-color:var(--primary-hover)}

/* ---------- content / list ---------- */
.content{flex:1;overflow-y:auto;padding:6px 24px 24px}
.list{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.list-head{
  display:grid;grid-template-columns:1fr 140px 250px 160px;
  padding:12px 20px;font-size:calc(11.5px * var(--text-scale));text-transform:uppercase;letter-spacing:.06em;
  color:var(--text-dim);border-bottom:1px solid var(--border);
}
.row{
  display:grid;grid-template-columns:1fr 140px 250px 160px;align-items:center;
  padding:13px 20px;border-bottom:1px solid var(--border);position:relative;
}
.row:last-child{border-bottom:none}
.row.dir{cursor:pointer}
.row:hover{background:var(--bg)}
.row::before{
  content:"";position:absolute;left:0;top:10%;bottom:10%;width:3px;border-radius:0 3px 3px 0;
  background:transparent;
}
.row.dir::before{background:var(--primary)}
.row.file::before{background:var(--sage)}
.name-cell{display:flex;align-items:center;gap:12px;min-width:0}
.icon-chip{
  width:calc(36px * var(--text-scale));height:calc(36px * var(--text-scale));border-radius:10px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:calc(16px * var(--text-scale));
}
.row.dir .icon-chip{background:var(--primary-soft);color:var(--primary)}
.row.file .icon-chip{background:var(--sage-soft);color:var(--sage)}
.name-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:calc(14.5px * var(--text-scale))}
.size-cell,.date-cell{
  font-family:ui-monospace,"SF Mono","Cascadia Code","JetBrains Mono",monospace;
  font-size:calc(12.5px * var(--text-scale));color:var(--text-dim);
}
.size-cell{text-align:right;padding-right:16px}
.meta-cell{display:none}
.actions-cell{display:flex;justify-content:flex-end;gap:6px}
.icon-btn{
  width:36px;height:36px;border-radius:10px;border:1px solid transparent;background:transparent;
  color:var(--text-dim);cursor:pointer;font-size:calc(15px * var(--text-scale));display:flex;align-items:center;justify-content:center;
  transition:background .15s,color .15s;
}
.icon-btn:hover{background:var(--surface-2);color:var(--text);border-color:var(--border)}
.icon-btn.danger:hover{background:var(--danger-soft);color:var(--danger)}
.text-btn{
  padding:8px 14px;border-radius:10px;border:1px solid var(--border);background:var(--card);
  color:var(--primary);font-size:calc(13.5px * var(--text-scale));font-weight:600;cursor:pointer;
  transition:background .15s,color .15s,border-color .15s;
}
.text-btn:hover{background:var(--primary);border-color:var(--primary);color:#FFFFFF}
.text-btn:active{background:var(--primary-hover);border-color:var(--primary-hover)}
.empty{text-align:center;padding:64px 20px;color:var(--text-dim)}
.empty .glyph{font-size:calc(34px * var(--text-scale));display:block;margin-bottom:14px;opacity:.7}
.empty strong{color:var(--text);display:block;font-size:calc(15px * var(--text-scale));margin-bottom:4px}

@media (max-width:900px){
  .list-head,.row{grid-template-columns:1fr 140px 160px}
  .list-head span:nth-child(3),.date-cell{display:none}
}
/* ---------- phones ---------- */
@media (max-width:640px){
  :root{--text-scale:1.15}

  header{
    padding:12px 16px;gap:10px;
    padding-top:max(12px, env(safe-area-inset-top));
  }
  .brand-mark{border-radius:8px}
  /* breadcrumb gets its own line and scrolls sideways instead of wrapping */
  .breadcrumb{
    flex:1 1 100%;flex-wrap:nowrap;overflow-x:auto;white-space:nowrap;
    margin:0 -16px;padding:0 16px;scrollbar-width:none;
  }
  .breadcrumb::-webkit-scrollbar{display:none}
  .breadcrumb span{padding:8px 12px}

  .toolbar{padding:12px 16px}
  .toolbar .btn{flex:1;justify-content:center;min-height:52px}

  .content{padding:0 16px calc(16px + env(safe-area-inset-bottom))}

  /* each row becomes a card: icon on the left, name with "size · date" under it, button on the right */
  .list-head{display:none}
  .row{
    grid-template-columns:auto 1fr auto;
    grid-template-areas:"icon name action" "icon meta action";
    column-gap:12px;row-gap:2px;padding:12px 14px;
  }
  .name-cell{display:contents}
  .icon-chip{grid-area:icon;align-self:center}
  .name-text{
    grid-area:name;align-self:end;min-width:0;
    white-space:normal;overflow-wrap:anywhere;
    display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;
  }
  .size-cell,.date-cell{display:none}
  .meta-cell{
    grid-area:meta;align-self:start;display:block;
    font-size:calc(12.5px * var(--text-scale));color:var(--text-dim);
  }
  .actions-cell{grid-area:action}
  .text-btn{min-height:44px;padding:10px 16px}

  .modal-overlay{align-items:flex-end;padding:0}
  .modal{
    width:100%;border-radius:18px 18px 0 0;border-bottom:none;
    padding:22px 16px calc(22px + env(safe-area-inset-bottom));
  }
  .modal .btn-row .btn{flex:1;justify-content:center;min-height:48px}

  .toast{
    left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));text-align:center;
  }
}

/* touch screens: no sticky hover lift */
@media (hover:none){
  .btn:hover{transform:none}
  .row:hover{background:transparent}
}

/* ---------- modal ---------- */
.modal-overlay{
  display:none;position:fixed;inset:0;background:rgba(52,49,46,.28);backdrop-filter:blur(2px);
  z-index:100;justify-content:center;align-items:center;padding:20px;
}
.modal-overlay.active{display:flex}
.modal{
  background:var(--card);border:1px solid var(--border);border-radius:18px;
  padding:26px;width:540px;max-width:100%;box-shadow:0 20px 50px rgba(52,49,46,.14);
}
.modal h3{margin-bottom:16px;font-size:calc(17px * var(--text-scale));font-weight:700}
.modal p{color:var(--text-dim);font-size:calc(14px * var(--text-scale));line-height:1.5}
.modal input{
  width:100%;padding:13px 14px;border:1px solid var(--border);border-radius:10px;
  font-size:calc(14.5px * var(--text-scale));margin:14px 0 20px;background:var(--bg);color:var(--text);
}
.modal input:focus{border-color:var(--primary)}
.modal .btn-row{display:flex;gap:10px;justify-content:flex-end}

/* ---------- toast ---------- */
.toast{
  position:fixed;bottom:24px;right:24px;background:var(--card);color:var(--text);
  border:1px solid var(--border);border-left:4px solid var(--sage);padding:13px 20px;border-radius:12px;font-size:calc(13.5px * var(--text-scale));
  z-index:200;display:none;box-shadow:0 10px 26px rgba(52,49,46,.12);font-weight:500;
}
.toast.show{display:block;animation:riseIn .2s ease-out}
.toast.error{border-color:var(--danger);color:var(--primary-hover)}
@keyframes riseIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- drop zone ---------- */
#drop-zone{
  display:none;position:fixed;inset:0;background:rgba(250,247,242,.9);backdrop-filter:blur(3px);
  border:3px dashed var(--primary);z-index:50;justify-content:center;align-items:center;flex-direction:column;gap:12px;
}
#drop-zone.active{display:flex}
#drop-zone .glyph{font-size:calc(44px * var(--text-scale))}
#drop-zone span{font-size:calc(19px * var(--text-scale));color:var(--primary);font-weight:700}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark">📦</div>
    <h1>ShareFile</h1>
  </div>
  <div class="breadcrumb" id="breadcrumb"></div>
</header>

<div class="toolbar">
  <button class="btn primary" onclick="openUpload()"><span class="glyph">⬆</span>Загрузить</button>
</div>

<div class="content">
  <div class="list">
    <div class="list-head">
      <span>Name</span><span style="text-align:right;padding-right:16px">Size</span><span>Modified</span><span></span>
    </div>
    <div id="file-list"></div>
  </div>
  <div class="empty" id="empty-msg" style="display:none">
    <span class="glyph">🗂️</span>
    <strong>This folder is empty</strong>
    Upload a file to get started.
  </div>
</div>

<div class="modal-overlay" id="modal-rename">
  <div class="modal">
    <h3>Rename</h3>
    <input id="rename-input" type="text">
    <div class="btn-row">
      <button class="btn ghost" onclick="closeModal('modal-rename')">Cancel</button>
      <button class="btn primary" onclick="doRename()">Rename</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-mkdir">
  <div class="modal">
    <h3>New Folder</h3>
    <input id="mkdir-input" type="text" placeholder="Folder name">
    <div class="btn-row">
      <button class="btn ghost" onclick="closeModal('modal-mkdir')">Cancel</button>
      <button class="btn primary" onclick="doMkdir()">Create</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-delete">
  <div class="modal">
    <h3>Delete</h3>
    <p id="delete-msg" style="margin-bottom:12px"></p>
    <div class="btn-row">
      <button class="btn ghost" onclick="closeModal('modal-delete')">Cancel</button>
      <button class="btn danger" onclick="doDelete()">Delete</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div id="drop-zone"><span class="glyph">⬆</span><span>Drop files here to upload</span></div>

<input type="file" id="file-input" multiple style="display:none">

<script>
let currentPath = "";
let pendingRename = null;
let pendingDelete = null;

async function api(url, opts) {
  const r = await fetch(url, opts);
  return r.json();
}

function fmtSize(b) {
  if (b === 0) return "0 B";
  const u = ["B","KB","MB","GB","TB"];
  const i = Math.floor(Math.log(b) / Math.log(1024));
  return (b / Math.pow(1024, i)).toFixed(i ? 1 : 0) + " " + u[i];
}

function fmtDate(ts) {
  return new Date(ts * 1000).toLocaleString();
}

function toast(msg, err) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast show" + (err ? " error" : "");
  setTimeout(() => t.className = "toast", 3000);
}

function openModal(id) { document.getElementById(id).classList.add("active"); }
function closeModal(id) { document.getElementById(id).classList.remove("active"); }

async function loadDir(path) {
  currentPath = path || "";
  const data = await api("/api/list?path=" + encodeURIComponent(currentPath));
  if (data.error) { toast(data.error, true); return; }

  renderBreadcrumb();
  const list = document.getElementById("file-list");
  const empty = document.getElementById("empty-msg");
  list.innerHTML = "";

  if (currentPath) {
    const parent = currentPath.split("/").slice(0, -1).join("/");
    const row = document.createElement("div");
    row.className = "row dir";
    row.innerHTML = `<div class="name-cell"><span class="icon-chip">📁</span><span class="name-text">..</span></div><span></span><span></span><span></span>`;
    row.onclick = () => loadDir(parent);
    list.appendChild(row);
  }

  if (data.items.length === 0) {
    empty.style.display = "block";
  } else {
    empty.style.display = "none";
    data.items.forEach(item => {
      const row = document.createElement("div");
      row.className = "row " + (item.is_dir ? "dir" : "file");
      const relPath = currentPath ? currentPath + "/" + item.name : item.name;
      row.innerHTML = `
        <div class="name-cell"><span class="icon-chip">${item.is_dir ? "📁" : "📄"}</span><span class="name-text">${esc(item.name)}</span></div>
        <span class="size-cell">${item.is_dir ? "" : fmtSize(item.size)}</span>
        <span class="date-cell">${fmtDate(item.mtime)}</span>
        <span class="meta-cell">${item.is_dir ? "" : fmtSize(item.size).replace(" ", "\u00a0") + " · "}${new Date(item.mtime * 1000).toLocaleDateString()}</span>
        <div class="actions-cell">
          ${item.is_dir
            ? ""
            : `<button class="text-btn" onclick="event.stopPropagation();window.open('/api/download?path=${encodeURIComponent(relPath).replace(/'/g, "%27")}')">Скачать</button>`}
        </div>`;
      if (item.is_dir) row.onclick = () => loadDir(relPath);
      list.appendChild(row);
    });
  }
}

function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

function renderBreadcrumb() {
  const bc = document.getElementById("breadcrumb");
  bc.innerHTML = "";
  const home = document.createElement("span");
  home.textContent = "Home";
  home.onclick = () => loadDir("");
  bc.appendChild(home);
  if (!currentPath) return;
  currentPath.split("/").forEach((part, i) => {
    const sep = document.createElement("span");
    sep.className = "crumb-sep";
    sep.textContent = "/";
    bc.appendChild(sep);
    const s = document.createElement("span");
    s.textContent = part;
    const p = currentPath.split("/").slice(0, i + 1).join("/");
    s.onclick = () => loadDir(p);
    bc.appendChild(s);
  });
}

function refresh() { loadDir(currentPath); }

function openRename(name) {
  pendingRename = name;
  document.getElementById("rename-input").value = name;
  openModal("modal-rename");
}

async function doRename() {
  const newName = document.getElementById("rename-input").value.trim();
  if (!newName || newName === pendingRename) { closeModal("modal-rename"); return; }
  const src = currentPath ? currentPath + "/" + pendingRename : pendingRename;
  const dst = currentPath ? currentPath + "/" + newName : newName;
  const r = await api("/api/rename", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({src, dst})
  });
  closeModal("modal-rename");
  if (r.error) toast(r.error, true);
  else { toast("Renamed"); refresh(); }
}

function openDelete(name, isDir) {
  pendingDelete = name;
  document.getElementById("delete-msg").textContent = `Delete "${name}"${isDir ? " and all its contents?" : "?"}`;
  openModal("modal-delete");
}

async function doDelete() {
  const path = currentPath ? currentPath + "/" + pendingDelete : pendingDelete;
  const r = await api("/api/delete", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({path})
  });
  closeModal("modal-delete");
  if (r.error) toast(r.error, true);
  else { toast("Deleted"); refresh(); }
}

function openNewFolder() { openModal("modal-mkdir"); document.getElementById("mkdir-input").value = ""; document.getElementById("mkdir-input").focus(); }

async function doMkdir() {
  const name = document.getElementById("mkdir-input").value.trim();
  if (!name) { closeModal("modal-mkdir"); return; }
  const path = currentPath ? currentPath + "/" + name : name;
  const r = await api("/api/mkdir", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({path})
  });
  closeModal("modal-mkdir");
  if (r.error) toast(r.error, true);
  else { toast("Created"); refresh(); }
}

function openUpload() { document.getElementById("file-input").click(); }

document.getElementById("file-input").addEventListener("change", async (e) => {
  const files = e.target.files;
  for (const file of files) {
    const fd = new FormData();
    fd.append("path", currentPath);
    fd.append("file", file);
    const r = await fetch("/api/upload", {method: "POST", body: fd}).then(r => r.json());
    if (r.error) toast(r.error, true);
  }
  if (files.length) { toast("Uploaded " + files.length + " file(s)"); refresh(); }
  e.target.value = "";
});

// Drag and drop
const dz = document.getElementById("drop-zone");
let dragCounter = 0;
document.addEventListener("dragenter", (e) => { e.preventDefault(); dragCounter++; dz.classList.add("active"); });
document.addEventListener("dragleave", (e) => { e.preventDefault(); dragCounter--; if (dragCounter <= 0) { dz.classList.remove("active"); dragCounter = 0; }});
document.addEventListener("dragover", (e) => e.preventDefault());
document.addEventListener("drop", async (e) => {
  e.preventDefault();
  dz.classList.remove("active");
  dragCounter = 0;
  const files = e.dataTransfer.files;
  for (const file of files) {
    const fd = new FormData();
    fd.append("path", currentPath);
    fd.append("file", file);
    const r = await fetch("/api/upload", {method: "POST", body: fd}).then(r => r.json());
    if (r.error) toast(r.error, true);
  }
  if (files.length) { toast("Uploaded " + files.length + " file(s)"); refresh(); }
});

loadDir("");
</script>
</body>
</html>
